# Example Siteloom site configuration.
# Copy to site.yaml and adjust for your deployment.

site_id: kai-apartments
site_name: Kai Apartments

# The site's IANA timezone (CLD-100). Storage stays naive UTC; the console
# and incident exports convert to this zone at display, and times typed
# into console forms are read in it. Usually set from the /classes admin
# panel (typed, detected from the UniFi NVR, or seeded from a browser)
# rather than edited here. Empty = show UTC, labelled as UTC.
# timezone: Europe/Bucharest

unifi:
  host: 192.168.1.1
  port: 443
  username: siteloom
  password: change-me
  verify_ssl: false

backend:
  kind: local   # PoC: synchronous in-process execution (PRD §7)

detection:
  model: yolo11n.pt
  device: mps
  confidence: 0.4
  # Context kept around each detection crop, as a fraction of the box on
  # each side. Changing it changes what the embedders see: re-enroll and
  # `siteloom classes rebuild` afterwards.
  crop_margin: 0.12

storage:
  db_url: sqlite:///siteloom.db
  media_dir: media

# How `siteloom serve` binds, and what `siteloom service install` writes
# into the generated launchd plist / systemd unit. Defaults shown. These
# live here rather than in install flags so that copying this file to
# another host copies the deployment's shape with it.
service:
  host: 127.0.0.1
  port: 8000
  log_level: INFO
  log_dir: logs           # relative to this file, like media_dir
  # Long enough for an in-flight batch to commit. `run` and `frigate`
  # units raise this to 60s; see docs/operations.md.
  stop_timeout_s: 30
  restart: on-failure     # on-failure | always | never
  restart_delay_s: 10
  start_at_boot: true

# Event consolidation & significance (defaults shown). One physical visit
# arrives as many short samples; these rules decide what becomes one event
# and what shows in default triage. After changing them, `siteloom events
# retag` reapplies significance to existing rows.
# events:
#   min_detections: 3         # significance gate: samples needed...
#   min_confidence: 0.5       # ...with best confidence at least this
#   track_link_gap_s: 120.0   # max silence before a track id starts a new event
#   stitch_gap_s: 15.0        # reattach trackless fragments seen in the same spot
#   stitch_candidates: 5      # recent events the stitcher tries (newest first)
#   merge_gap_s: 60.0         # fold same-identity fragments into one event (0 = off)

identity:
  enabled: true
  vector_db_path: identity_db   # Qdrant embedded mode — a directory, no server
  auto_add_classes: true        # unseen classes get a generic identifier on the fly
  # Vehicle fingerprint (CLD-254), off by default: per-frame color reads
  # on vehicle crops, shown as a chip row on vehicle event pages. Every
  # read records its measurements next to the floors applied, so the
  # floors are retuned by querying rows, never by re-running.
  # fingerprint:
  #   enabled: true
  #   classes: [car, truck, bus, motorcycle]  # default: follows the
  #                               # vehicle identifier's applies_to
  #   min_px: 32                  # crops narrower than this name no color
  #   chroma_floor: 12.0          # below this the crop is grayscale (IR)
  #                               # and no color is named
  # An identifier you name is merged OVER the defaults below, key by
  # key: writing `face: {threshold: 0.42}` keeps face's min_margin and
  # min_sightings rather than dropping them (CLD-125 — it used to drop
  # them, which switched off the CLD-41 gating silently). Stating a
  # value always wins, including `min_sightings: 1`; omitting a whole
  # identifier still removes it. `siteloom doctor` prints the gates
  # actually in force.
  # identifiers:                # per-class algorithms; defaults shown
  #   face:    {algo: face,    applies_to: [person], threshold: 0.36,
  #             min_margin: 0.05, min_sightings: 2}
  #   person:  {algo: generic, applies_to: [person], threshold: 0.80,
  #             min_margin: 0.02, min_sightings: 2}
  #   vehicle: {algo: generic, applies_to: [car, truck, bus, motorcycle],
  #             threshold: 0.82, min_margin: 0.02, plate_ocr: true}
  # Plate-read quality floors (vehicle identifier, all 0 = off). OCR
  # confidence is the weakest of them: a motion-smeared 60-pixel plate
  # scores 0.9 because the model is sure about characters it
  # interpolated. Reject on what the picture could carry instead —
  #   plate_min_width_px: 100        # plate region's width in source px
  #   plate_min_sharpness: 40.0      # variance of the Laplacian (blur)
  #   plate_min_char_confidence: 0.5 # weakest character, not the mean
  # Every read is measured whether or not a floor is set, and a read
  # that fails one is a row on /plates with the reason — so pick the
  # numbers off your own reads, and moving one re-reads the table
  # rather than re-running anything.
  # min_margin: required gap over the runner-up identity before a visual
  #   match is accepted (near-ties stay unresolved). min_sightings: how
  #   many mutually-similar sightings before an unknown identity is
  #   minted (1 = immediately); detection confidence >= immediate_quality
  #   (0.85) or a plate bypasses the gate.
  # recency_window_s: 120.0     # same-camera tie-break window
  # pending_ttl_s: 3600.0       # unknown sightings expire after this

audio:
  enabled: true
  threshold_db: -25.0   # dBFS, calibrate per microphone
  min_duration_s: 30
  release_s: 5

backfill:
  parallel: 2           # cameras backfilled at once (0 = all picked); CLD-317

guests:
  ical: ""              # booking iCal URL or .ics path — or a list, one per unit
  # ical:
  #   - https://example.com/api/ical/casa-1.ics
  #   - https://example.com/api/ical/casa-2.ics
  checkin_time: "15:00" # site wall time attached to all-day feed dates
  checkout_time: "11:00"
  arrival_pre_hours: 2
  arrival_post_hours: 4

integrations:
  mqtt:
    enabled: false      # publish siteloom/events + siteloom/identity
    host: localhost
    port: 1883
  frigate:              # consume an existing Frigate NVR's events
    enabled: false      # run with: siteloom frigate
    api_url: http://localhost:5000
    mqtt_topic: frigate/events
    labels: [person, car, truck, motorcycle, bus]
    min_score: 0.6
  recognition_api:      # CompreFace-compatible /api/v1/recognition/...
    # SECURITY: this surface serves biometric matching AND face
    # enrollment. Off by default; when enabling, set api_key (the
    # x-api-key / Double Take "key"). Enabled with an empty api_key
    # refuses to start unless you also set allow_open: true — an
    # explicit "yes, serve unauthenticated on this network" opt-in.
    enabled: false
    api_key: ""         # required to enable, unless allow_open below
    # allow_open: true  # DANGEROUS: anyone reaching the port can enroll
    # rate_limit_per_minute: 60  # per-client-IP budget; 0 disables
  webhooks: []
  # webhooks:
  #   - url: https://example.com/hook
  #     events: [identity.match, identity.unknown, identity.new_plate]
  #     token: optional-bearer

cameras:
  # A local video file — useful for development/testing without live
  # cameras, and the seed of the backfill path (PRD §6.6).
  - id: sample-file
    name: Sample clip
    adapter: file
    source: ./samples/sample.mp4
    sample_fps: 2.0
    modules: [detection, identity, audio]

  # A UniFi Protect camera. `source` is the Protect camera id
  # (see `siteloom cameras` to list them).
  # - id: driveway
  #   name: Driveway
  #   adapter: unifi
  #   source: 6459fabc0123456789abcdef
  #   sample_fps: 2.0
  #   modules: [detection]
  #   require_zone: true
  #   zones:
  #     - name: driveway-entrance
  #       points: [[0.1, 0.5], [0.9, 0.5], [0.9, 1.0], [0.1, 1.0]]
  #   # Per-camera tuning (NFR3: config, never code). Only the fields
  #   # named here override the site-wide values above.
  #   events:
  #     min_detections: 5             # busier view, demand more evidence
  #     stitch_min_iou: 0.1
  #     identify_min_confidence: 0.6  # identity gates are per-camera too
  #     identify_min_crop_px: 96
  #     identify_only_significant: true
  #   identity:
  #     # Cosine thresholds, per identifier and on that identifier's own
  #     # scale (face ≈0.36, generic ≈0.80 — not comparable numbers).
  #     thresholds:
  #       face: 0.40
  #       vehicle: 0.85
