[project]
name = "siteloom"
version = "0.1.0"
description = "Multi-site video & audio intelligence platform (Kai Apartments PoC)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "lap>=0.5.12",  # ByteTrack dependency; ultralytics can't auto-install it in a uv venv
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "uiprotect>=6.0",
    "typer>=0.12",
    "qdrant-client>=1.19.0",
    "av>=18.0.0",
    "icalendar>=7.2.2",
    "python-multipart>=0.0.32",
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Plate detection + OCR (PRD §6.4 plate path) — onnx-based, optional:
# without it the vehicle identifier degrades to visual re-ID only.
plates = [
    "fast-plate-ocr[onnx]>=1.0",
    "open-image-models>=0.4",
]

[project.scripts]
siteloom = "siteloom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siteloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
